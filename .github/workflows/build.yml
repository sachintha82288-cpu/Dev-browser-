name: Build

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    # GeckoView is a ~230 MB AAR and dexing it takes a while, so give the job
    # room instead of relying on the 6 hour default.
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home (GeckoView is a big download).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK with licences accepted, so AGP
      # installs platform android-37.1 and build-tools 37.0.0 on demand.
      # GeckoView comes from
      # maven.mozilla.org (declared in settings.gradle.kts).
      - name: Build debug APKs (per-ABI splits + universal)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      # Kotlin/AGP errors are much easier to act on in the PR than in a log tab.
      - name: Report build errors on the pull request
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### :x: \`assembleDebug\` failed"
            echo
            echo '```'
            grep -E "^e: |^FAILURE|What went wrong|Caused by:|Execution failed for task|error:|A problem occurred|Deprecated Gradle|requires Android Gradle plugin|compile against version" build.log | head -n 150
            echo '```'
            echo
            echo "<details><summary>compiler warnings ($(grep -cE '^w: ' build.log))</summary>"
            echo
            echo '```'
            grep -E "^w: " build.log | head -n 40
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>tail of the Gradle log</summary>"
            echo
            echo '```'
            tail -n 80 build.log
            echo '```'
            echo
            echo "</details>"
          } > build-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-report.md

      - name: Upload the Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: List the APKs that were produced
        if: steps.build.outcome == 'success'
        run: |
          cd app/build/outputs/apk/debug
          ls -lh *.apk
          sha256sum *.apk

      # Only the arm64-v8a APK is uploaded: a GeckoView APK is ~100 MB per ABI
      # and the universal one is several times that, which would blow straight
      # through the Actions storage quota. Build the other ABIs locally with
      # ./gradlew assembleDebug (see README).
      - name: Upload the arm64-v8a debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: devbrowser-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Fail the job when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
