name: Release

# Publishing is the only thing this workflow does: `build.yml` already proves every
# push compiles, so a tag push just builds the installable APKs once more and hangs
# them on a GitHub Release. Nothing here is signed with a real key — the debug APKs
# are signed with the debug keystore, which is what makes them installable, and the
# `release` variant stays unsigned on purpose (no keystore belongs in this repo).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)attach the APKs to"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the per-ABI debug APKs are attached: the universal one is ~500 MB for
      # no benefit (adb picks the right split anyway), and x86 is only useful to an
      # emulator, which can install the split from a local build.
      - name: Build the debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — only re-uploading assets."
            exit 0
          fi
          cat > notes.md <<EOF
          Built by GitHub Actions from \`${GITHUB_SHA}\`.

          **Install**

          \`\`\`bash
          adb install app-arm64-v8a-debug.apk
          \`\`\`

          Or copy the matching APK to the phone and open it (allow "install unknown
          apps" for your file manager).

          - **arm64-v8a** — almost every phone from the last few years
          - **armeabi-v7a** — older 32-bit phones
          - **x86_64** — 64-bit emulators

          These are **debug** builds signed with the Android debug key: fine to
          sideload, not for a store upload. The \`release\` variant builds in CI too
          but is left unsigned, so it cannot be installed.

          Engine: GeckoView 157 (Firefox). Min SDK 26.
          EOF
          gh release create "$TAG" \
            --title "DevBrowser ${TAG#v}" \
            --notes-file notes.md \
            --prerelease

      - name: Attach the APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            app/build/outputs/apk/debug/app-x86_64-debug.apk \
            --clobber
          gh release view "$TAG" --json assets \
            -q '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
